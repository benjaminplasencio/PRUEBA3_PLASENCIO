<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ferretería</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar-custom {
            background-color: #000000;
        }
        .navbar-custom .navbar-brand {
            color: #ffffff;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #b02a37;
            border-color: #a52834;
        }
        footer {
            background-color: #000000;
            color: #ffffff;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-custom shadow-sm py-2">
        <div class="container d-flex justify-content-between align-items-center">
            
            <!-- Título / Logo -->
            <a class="navbar-brand fw-bold mb-0" href="{% url 'listar_productos' %}">Ferretería</a>
            
            <!-- Botones siempre visibles (solo cuando hay sesión) -->
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white-50 small me-3 d-none d-md-block">Usuario: <strong class="text-white">{{ user.username }}</strong></span>
                    <a href="{% url 'listar_productos' %}" class="btn btn-outline-light btn-sm fw-semibold me-2">Inicio</a>
                    <form action="{% url 'salir' %}" method="POST" class="d-inline mb-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm fw-semibold">Cerrar Sesión</button>
                    </form>
                {% endif %}
            </div>
            
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 border-top border-danger">
        <div class="container">
            <p class="mb-0 small">Benjamin Plasencio - 2026 | Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
